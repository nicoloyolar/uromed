{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Médica - UROMED</title>
    <link rel="stylesheet" href="{% static 'css/styles-nuevo-paciente.css' %}">
</head>
<body>
    <div class="form-container">
        <form method="POST" action="{% if paciente.id %}{% url 'nuevo_o_actualizar_paciente' paciente_id=paciente.id %}{% else %}{% url 'nuevo_o_actualizar_paciente' %}{% endif %}">

            {% csrf_token %}
            
            <fieldset>
                <legend>Datos Personales</legend>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" value="{{ paciente.nombre }}" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" value="{{ paciente.apellido }}" required>
                </div>
                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" value="{{ paciente.edad }}" required>
                </div>
                <div class="form-group">
                    <label for="genero">Género:</label>
                    <select id="genero" name="genero" required>
                        <option value="masculino" {% if paciente.genero == 'masculino' %}selected{% endif %}>Masculino</option>
                        <option value="femenino" {% if paciente.genero == 'femenino' %}selected{% endif %}>Femenino</option>
                        <option value="otro" {% if paciente.genero == 'otro' %}selected{% endif %}>Otro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" value="{{ paciente.direccion }}">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="text" id="telefono" name="telefono" value="{{ paciente.telefono }}">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="{{ paciente.email }}">
                </div>
                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ paciente.fecha_nacimiento|date:'Y-m-d' }}">
                </div>
                <div class="form-group">
                    <label for="estado_civil">Estado Civil:</label>
                    <select id="estado_civil" name="estado_civil" required>
                        <option value="soltero" {% if paciente.estado_civil == 'soltero' %}selected{% endif %}>Soltero</option>
                        <option value="casado" {% if paciente.estado_civil == 'casado' %}selected{% endif %}>Casado</option>
                        <option value="divorciado" {% if paciente.estado_civil == 'divorciado' %}selected{% endif %}>Divorciado</option>
                        <option value="viudo" {% if paciente.estado_civil == 'viudo' %}selected{% endif %}>Viudo</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Datos Médicos</legend>
                <div class="form-group">
                    <label for="antecedentes_medicos">Antecedentes Médicos:</label>
                    <textarea id="antecedentes_medicos" name="antecedentes_medicos">{{ paciente.antecedentes_medicos }}</textarea>
                </div>
                <div class="form-group">
                    <label for="alergias">Alergias:</label>
                    <textarea id="alergias" name="alergias">{{ paciente.alergias }}</textarea>
                </div>
                <div class="form-group">
                    <label for="medicamentos">Medicamentos:</label>
                    <textarea id="medicamentos" name="medicamentos">{{ paciente.medicamentos }}</textarea>
                </div>
                <div class="form-group">
                    <label for="presion_arterial">Presión Arterial:</label>
                    <input type="text" id="presion_arterial" name="presion_arterial" value="{{ paciente.presion_arterial }}">
                </div>
                <div class="form-group">
                    <label for="frecuencia_cardiaca">Frecuencia Cardíaca:</label>
                    <input type="number" id="frecuencia_cardiaca" name="frecuencia_cardiaca" value="{{ paciente.frecuencia_cardiaca }}">
                </div>
                <div class="form-group">
                    <label for="peso">Peso (kg):</label>
                    <input type="number" step="0.1" id="peso" name="peso" value="{{ paciente.peso }}">
                </div>
                <div class="form-group">
                    <label for="talla">Talla (cm):</label>
                    <input type="number" id="talla" name="talla" value="{{ paciente.talla }}">
                </div>
                <div class="form-group">
                    <label for="saturacion">Saturación de Oxígeno (%):</label>
                    <input type="number" id="saturacion" name="saturacion" value="{{ paciente.saturacion }}">
                </div>
                <div class="form-group">
                    <label for="temperatura">Temperatura (°C):</label>
                    <input type="number" step="0.1" id="temperatura" name="temperatura" value="{{ paciente.temperatura }}">
                </div>
                <div class="form-group">
                    <label for="frecuencia_respiratoria">Frecuencia Respiratoria:</label>
                    <input type="number" id="frecuencia_respiratoria" name="frecuencia_respiratoria" value="{{ paciente.frecuencia_respiratoria }}">
                </div>
            </fieldset>

            <button type="submit">Guardar</button>
        </form>
    </div>
</body>
</html>
